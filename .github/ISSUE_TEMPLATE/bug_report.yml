name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
  - type: textarea
    id: logs
    attributes:
      label: Script output / logs
      description: Paste the output from `python3 lidarr_queue_maintenance.py`
      render: text
  - type: input
    id: lidarr-version
    attributes:
      label: Lidarr version
      description: From System → Status
